camera_node:
  ros__parameters:
    color_image_topic: /camera/camera/color/image_raw
    depth_image_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/aligned_depth_to_color/camera_info
    # color_image_topic: "/head_front_camera/rgb/image_raw"
    # depth_image_topic: "/head_front_camera/depth_registered/image_raw"
    # camera_info_topic: "/head_front_camera/depth_registered/camera_info"
    frames_approx_sync: False
    depth_frame_encoding: 32FC1
    depth_unit_in_meters: False


    post_processing:
      package: "skeleton_tracking"
      module: "skeleton_post_processing"
      class: "SkeletonDetection"

    skeleton_detection_node:
      skeleton_algorithm: 'mediapipe'
      mediapipe: 
        min_detection_confidence: 0.8
        min_tracking_confidence: 0.5

      roi_half_size: 1
      debug_topic: True


skeleton_filter_node:
  ros__parameters:
    q_noise: [0.01, 0.01, 0.01, 0.05, 0.05, 0.05, 0.1, 0.1, 0.1]
    r_noise: [0.05, 0.05, 0.1]

    custom_publishers: ["pose_array", "centroid"]
    pose_array:
      module: "skeleton_tracking.custom_publishers.pose_array_publisher.PoseArrayPublisher"
    centroid:
      module: "skeleton_tracking.custom_publishers.centroid_publisher.CentroidPublisher"
